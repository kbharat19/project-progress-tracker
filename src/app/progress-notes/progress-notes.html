<h2>Progress Notes</h2>
 
<form [formGroup]="progressForm">

    <div>
        <label for="project-code">Project Code:</label>
        <input
            id="project-code"
            type="text"
            formControlName="projectCode"
            (blur)="updateProjectName()">
    </div>

     <p style="color:red;"> {{ errorMessage }} </p>
 
    <div>
        <label for="project-name">Project Name:</label>
        <input
            id="project-name"
            type="text"
            formControlName="projectName">
    </div>
 
    <div>
        <label for="date">Date:</label>
        <input
            id="date"
            type="date"
            formControlName="date">
    </div>
 
    <div>
        <label for="status">Current Status:</label>
 
        <select
            id="status"
            formControlName="currentStatus">
 
            <option value="On Track">On Track</option>
            <option value="Needs Attention">Needs Attention</option>
            <option value="Completed">Completed</option>
        </select>
    </div>
 
    <div>
        <label for="team-member">Team Member:</label>
        <input
            id="team-member"
            type="text"
            formControlName="teamMember">
    </div>


 
    <!-- <div>
        <label for="note">Progress Note:</label>
        <textarea
            id="note"
            rows="4"
            formControlName="progressNote">
        </textarea>
    </div> -->
    <div>
        <label for="progress-notes">Progress Note:</label>
        <input
            id="progress-notes"
            type="text"
            [(ngModel)]="progressNotes">

        <p>Current Note: {{ progressNotes }}</p>
    </div>
</form>
